<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="js/jquery.min.js"></script>
</head>
<body>

    <button class="btn1">FadeIn</button> <button class="btn2">FadeOut</button>
    <button class="btn3">FadeIn/FadeOut</button>
    <div class="box1" style="width: 100px; height: 150px; background-color: yellowgreen; display: none;"></div>

    <script>
        $(function () {  
            // $(".box1").fadeIn(5000);

            $(".btn1").click(function(){
                $(".box1").fadeIn(5000);
            });

            $(".btn2").click(function(){
                $(".box1").fadeOut(1000);
            });

            $(".btn3").click(function(){
                $(".box1").fadeToggle(5000);
            });
        });
        
    </script>
</body>
</html>
