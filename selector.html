<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src ="js/jquery.min.js"></script>
</head>
<body>
    <h1>This is Heading h1</h1> <br>
    <h2>This is Heading h2</h2> <br>
    <p>This is first paragraph</p> <br>
    <ul>
        <li>Rose</li>
        <li>Chameli</li>
        <li>Belly</li>
        <li>Waterlily</li>
    </ul>
    <br>
    <button class="btn1">Hide all</button> <button class="btn2">Hide paragraph</button>
    <button class="btn3">Hide last item</button>



    <script>
        $(document).ready(function () {
            $(".btn1").click(function(){
                $("*").hide();
            });
            $(".btn2").click(function(){
                $("p").hide();
            });
            $(".btn3").click(function(){
                $("ul li:first").hide();
            });
        });
    </script>
</body>
</html>
